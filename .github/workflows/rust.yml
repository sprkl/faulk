name: Rust

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Nothing runs on a push to develop or main: the code was tested in its pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Which parts of the suite this pull request needs (scripts/ci/select.mjs, rules tested in
      # scripts/ci/select-core.test.mjs): a pull request against main (release, hotfix) runs
      # everything, any other the changed crates and the crates that depend on them (from
      # `cargo metadata`). The job always starts on a pull request, so its check name always
      # reports (a required check never stays pending); only its heavy steps are skipped.
      # RUSTUP_TOOLCHAIN: read the workspace with the preinstalled toolchain, without the
      # components and targets that rust-toolchain.toml asks for.
      - name: Select the tests
        id: changes
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: stable
        run: node scripts/ci/select.mjs

      - name: Setup Rust
        if: steps.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1-threads

      - name: Install audio headers
        if: steps.changes.outputs.rust == 'true'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.rust == 'true'

      - name: Format
        if: steps.changes.outputs.rust_checks == 'true'
        run: cargo fmt --all --check

      - name: Clippy
        if: steps.changes.outputs.rust_checks == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The changed crates and their dependents (`--workspace` when that is all of them). Includes
      # the native/WASM parity tests, which build the wasm modules themselves, when engine-wasm or
      # project-wasm depend on a changed crate.
      - name: Test
        if: steps.changes.outputs.rust_test != ''
        env:
          PACKAGES: ${{ steps.changes.outputs.rust_test }}
        run: cargo test $PACKAGES

      # The engine channel prototype (CT-3, web/src/lib/engine/proto/crate) is not a workspace
      # member: formatted and linted here for both of its targets.
      - name: Prototype crate (fmt, clippy)
        if: steps.changes.outputs.rust_proto == 'true'
        working-directory: web/src/lib/engine/proto/crate
        run: |
          cargo fmt --check
          cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --release --target wasm32-wasip1-threads -- -D warnings

      # The shipped engine is the wasm32-wasip1-threads build (MO-2); the parity tests run the
      # wasm32-unknown-unknown one in an interpreter.
      - name: WASM build of the engine
        if: steps.changes.outputs.rust_wasm_engine == 'true'
        run: |
          cargo build -p engine-wasm --target wasm32-wasip1-threads --release
          cargo build -p engine-wasm --target wasm32-unknown-unknown --release

      - name: WASM build of the project
        if: steps.changes.outputs.rust_wasm_project == 'true'
        run: cargo build -p project-wasm --target wasm32-unknown-unknown --release

  # The helper's Windows-only code (tray, registry, resources) builds only on Windows.
  helper-windows:
    # Nothing runs on a push to develop or main: the code was tested in its pull request.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # See the rust job: the job always starts on a pull request, its heavy steps run when the
      # helper or a crate it depends on changes (or on a pull request against main).
      - name: Select the tests
        id: changes
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: stable
        run: node scripts/ci/select.mjs

      - name: Setup Rust
        if: steps.changes.outputs.helper_windows == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.helper_windows == 'true'

      - name: Clippy
        if: steps.changes.outputs.helper_windows == 'true'
        run: cargo clippy -p helper --all-targets -- -D warnings

      - name: Test
        if: steps.changes.outputs.helper_windows == 'true'
        run: cargo test -p helper

      - name: Release build
        if: steps.changes.outputs.helper_windows == 'true'
        run: cargo build -p helper --release

      # The defaults a published helper ships with (production origins, "Open Faulk" on the
      # site) depend on the release profile: test them in that profile too.
      - name: Release defaults
        if: steps.changes.outputs.helper_windows == 'true'
        run: cargo test -p helper --release --bin faulk-helper
