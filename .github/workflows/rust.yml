name: Rust

on:
  push:
    branches: [develop, main]
  pull_request:

# Least privilege: a job that needs more says so itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Nothing runs on a push to develop or main: the code was tested in its pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Observed 49-61 min (full suite on a release pull request); a hung job must not run for the 6 h default.
    timeout-minutes: 90
    env:
      # No debug info in the dev and test profiles (#595, founder's decision): CI is not where we debug, a
      # failing test is reproduced locally. The full `debuginfo=2` made `target/debug` outgrow the runner's
      # disk (`No space left on device`, `ld ... Bus error`). Debug assertions and the allocation detector
      # are separate settings and stay on. The test profile inherits dev, so one variable covers both.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Which parts of the suite this pull request needs (scripts/ci/select.mjs, rules tested in
      # scripts/ci/select-core.test.mjs): a pull request against main (release, hotfix) runs
      # everything, any other the changed crates and the crates that depend on them (from
      # `cargo metadata`). The job always starts on a pull request, so its check name always
      # reports (a required check never stays pending); only its heavy steps are skipped.
      # RUSTUP_TOOLCHAIN: read the workspace with the preinstalled toolchain, without the
      # components and targets that rust-toolchain.toml asks for.
      - name: Select the tests
        id: changes
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: stable
        run: node scripts/ci/select.mjs

      # Free the preinstalled toolchains this job never uses, then print the space left
      # (#595): the runner's free disk was not enough for the workspace's tests.
      - name: Free disk space
        if: steps.changes.outputs.rust == 'true'
        run: |
          { echo "### Disk before cleanup"; df -h / | sed 's/^/    /'; } | tee -a "$GITHUB_STEP_SUMMARY"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          { echo "### Disk after cleanup"; df -h / | sed 's/^/    /'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Setup Rust
        if: steps.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@1.99.1 # pinned until #846 (Rust 1.100)
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1-threads

      - name: Install audio headers
        if: steps.changes.outputs.rust == 'true'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.rust == 'true'

      - name: Format
        if: steps.changes.outputs.rust_checks == 'true'
        run: cargo fmt --all --check

      - name: Clippy
        if: steps.changes.outputs.rust_checks == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The changed crates and their dependents (`--workspace` when that is all of them). Includes
      # the native/WASM parity tests, which build the wasm modules themselves, when engine-wasm or
      # project-wasm depend on a changed crate.
      - name: Test
        if: steps.changes.outputs.rust_test != ''
        env:
          PACKAGES: ${{ steps.changes.outputs.rust_test }}
        run: cargo test $PACKAGES

      # The engine channel prototype (CT-3, web/src/lib/engine/proto/crate) is not a workspace
      # member: formatted and linted here for both of its targets.
      - name: Prototype crate (fmt, clippy)
        if: steps.changes.outputs.rust_proto == 'true'
        working-directory: web/src/lib/engine/proto/crate
        run: |
          cargo fmt --check
          cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --release --target wasm32-wasip1-threads -- -D warnings

      # The shipped engine is the wasm32-wasip1-threads build (MO-2); the parity tests run the
      # wasm32-unknown-unknown one in an interpreter.
      - name: WASM build of the engine
        if: steps.changes.outputs.rust_wasm_engine == 'true'
        run: |
          cargo build -p engine-wasm --target wasm32-wasip1-threads --release
          cargo build -p engine-wasm --target wasm32-unknown-unknown --release

      - name: WASM build of the project
        if: steps.changes.outputs.rust_wasm_project == 'true'
        run: cargo build -p project-wasm --target wasm32-unknown-unknown --release

      # Measured even when a step failed: the free space at the end of the job and the size of target/.
      - name: Disk report
        if: always() && steps.changes.outputs.rust == 'true'
        run: |
          {
            echo "### Disk at the end of the job"
            df -h / | sed 's/^/    /'
            echo "target/: $(du -sh target 2>/dev/null | cut -f1)"
            bins=$(find target/debug/deps -maxdepth 1 -type f -executable ! -name '*.so' -size +1M -printf '%s %f\n' 2>/dev/null | sort -rn)
            echo "executables above 1 MB in target/debug/deps: $(echo "$bins" | grep -c .), $(echo "$bins" | awk '{s+=$1} END {printf "%.0f MB", s/1048576}')"
            echo "largest:"
            echo "$bins" | head -15 | awk '{printf "    %.0f MB %s\n", $1/1048576, $2}'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          avail=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          if [ "$avail" -lt 5 ]; then echo "::warning::Only ${avail} GB free at the end of the job (margin wanted: 5 GB)"; fi

  # The helper's Windows-only code (tray, registry, resources) builds only on Windows.
  helper-windows:
    # Nothing runs on a push to develop or main: the code was tested in its pull request.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    # Observed 8-15 min.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # See the rust job: the job always starts on a pull request, its heavy steps run when the
      # helper or a crate it depends on changes (or on a pull request against main).
      - name: Select the tests
        id: changes
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: stable
        run: node scripts/ci/select.mjs

      - name: Setup Rust
        if: steps.changes.outputs.helper_windows == 'true'
        uses: dtolnay/rust-toolchain@1.99.1 # pinned until #846 (Rust 1.100)
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.helper_windows == 'true'

      - name: Clippy
        if: steps.changes.outputs.helper_windows == 'true'
        run: cargo clippy -p helper --all-targets -- -D warnings

      - name: Test
        if: steps.changes.outputs.helper_windows == 'true'
        run: cargo test -p helper

      - name: Release build
        if: steps.changes.outputs.helper_windows == 'true'
        run: cargo build -p helper --release

      # The defaults a published helper ships with (production origins, "Open Faulk" on the
      # site) depend on the release profile: test them in that profile too.
      - name: Release defaults
        if: steps.changes.outputs.helper_windows == 'true'
        run: cargo test -p helper --release --bin faulk-helper

      # Measured for #595 (the Linux job ran out of disk): free space on C: and size of target/.
      - name: Disk report
        if: always() && steps.changes.outputs.helper_windows == 'true'
        shell: bash
        run: |
          {
            echo "### Disk at the end of the job"
            df -h /c | sed 's/^/    /'
            echo "target/: $(du -sh target 2>/dev/null | cut -f1)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

