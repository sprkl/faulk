name: Agent scripts

on:
  push:
    branches: [develop, main]
  pull_request:

# Least privilege: a job that needs more says so itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-scripts:
    # Nothing runs on a push to develop or main: the code was tested in its pull request.
    if: github.event_name == 'pull_request'
    # The agent guardrails (hooks, Judge Dredd brief, verification records), the CI selection
    # rules (scripts/ci/) and the helper's Blob publication (its logic needs no dependency;
    # @vercel/blob is loaded for real uploads only).
    runs-on: ubuntu-latest
    # Observed under 1 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # See ci.yml: the job always starts on a pull request, its heavy steps run when needed.
      - name: Select the tests
        id: changes
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: stable # read the workspace with the preinstalled toolchain
        run: node scripts/ci/select.mjs

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.agent_scripts == 'true'
        with:
          node-version: 24

      - name: Test the agent scripts
        if: steps.changes.outputs.agent_scripts == 'true'
        run: node --test "scripts/**/*.test.mjs"
