name: Web

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    # Nothing runs on a push to develop or main: the code was tested in its pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Which parts of the suite this pull request needs (scripts/ci/select.mjs, rules tested in
      # scripts/ci/select-core.test.mjs): a pull request against main (release, hotfix) runs
      # everything, any other only what its files can affect. The job always starts on a pull
      # request, so its check name always reports (a required check never stays pending); only
      # its heavy steps are skipped.
      - name: Select the tests
        id: changes
        shell: bash
        working-directory: .
        env:
          RUSTUP_TOOLCHAIN: stable # read the workspace with the preinstalled toolchain
        run: node scripts/ci/select.mjs

      # The web app builds the engine to WebAssembly and generates its types from Rust.
      - name: Setup Rust
        if: steps.changes.outputs.web == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1-threads

      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.web == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.web == 'true'
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.web == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.web == 'true'

      # `pnpm dev`, `build` and `test` regenerate src/lib/generated/ themselves; this fails when the
      # committed copy is stale. On a merge conflict there, regenerate (`pnpm gen:protocol`), never merge by hand.
      - name: Generated files are up to date
        if: steps.changes.outputs.web == 'true'
        run: pnpm gen:check

      - run: pnpm typecheck
        if: steps.changes.outputs.web == 'true'
      - run: pnpm lint
        if: steps.changes.outputs.web == 'true'
      - run: pnpm test
        if: steps.changes.outputs.web == 'true'
      - run: pnpm build
        if: steps.changes.outputs.web == 'true'

      # Real browser checks (tests/e2e/): cross-origin isolation, helper sockets, simulated Web
      # MIDI, the landing page. `dev` (the dev server) on a task pull request, `dev,preview` (also
      # the built site) on the pull request against main.
      - name: Install the Playwright browser
        if: steps.changes.outputs.e2e != ''
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        if: steps.changes.outputs.e2e != ''
        env:
          FAULK_E2E_PROJECTS: ${{ steps.changes.outputs.e2e }}
        run: pnpm test:e2e
