name: release-helper

# Builds, packages and publishes the native helper with Velopack.
# See docs/architecture/04-distribution-helper.md.
#
# The downloads and the update feed are served from the Vercel Blob store behind
# get.faulk.app (scripts/helper-release/publish.mjs, token: secret HELPER_RELEASES_READ_WRITE_TOKEN).
# A release of this repository keeps the archive and the changelog.
#
# Ways in, and only the first three publish:
#
#  - push of a tag `helper-v<version>`: the normal way to release. Builds, creates the release in
#    this repository, then publishes the files to Blob;
#  - workflow_dispatch with a `version`: the same without typing a tag (the release creates the tag
#    `helper-v<version>` on the built commit). Stable versions only from `main`, pre-releases from
#    `main` or `develop`. `draft` keeps the release as a draft and publishes nothing to Blob;
#  - workflow_dispatch with `mirror` (a tag such as `helper-v0.1.0`): publishes the files of that
#    existing release of this repository to Blob, without building (versions released before Blob);
#  - workflow_dispatch without a version, or a pull request that
#    touches this workflow, the helper's updater, wiring or manifest, the publication or
#    web/vercel.json: a trial build. Artifacts only, and a dry run of the Blob
#    publication on them. Windows and Linux only: the (expensive) macOS leg runs for a
#    production release alone, that is whenever there is a version (a tag, or a dispatch with a
#    version).
on:
  push:
    # Tags only: no trial build after a merge (the pull request ran it where it mattered, and
    # the tag build runs everything before a release).
    tags: ['helper-v*']
  pull_request:
    paths:
      - '.github/workflows/release-helper.yml'
      - 'crates/helper/src/updater.rs'
      - 'crates/helper/src/updater/**'
      # The wiring (#12) and the Velopack version: the trial build runs the wiring gate.
      - 'crates/helper/src/main.rs'
      - 'crates/helper/src/lib.rs'
      - 'crates/helper/Cargo.toml'
      # The publication and the redirects it must match: the trial build dry-runs it.
      - 'scripts/helper-release/**'
      - 'web/vercel.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the prefix (e.g. 0.2.0, 0.2.0-beta.1). Empty: trial build.'
        required: false
        default: ''
      draft:
        description: 'Keep the release as a draft (nothing is published to Blob)'
        type: boolean
        default: false
      mirror:
        description: 'Publish an existing release of this repository to Blob (e.g. helper-v0.1.0), without building'
        required: false
        default: ''

# Least privilege: a job that needs more says so itself (`release` writes contents).
permissions:
  contents: read

concurrency:
  group: release-helper-${{ github.ref }}-${{ inputs.version }}-${{ inputs.mirror }}
  cancel-in-progress: false

env:
  PACK_ID: FaulkHelper
  VPK_VERSION: '1.2.161' # must match the `velopack` crate pinned in crates/helper/Cargo.toml

jobs:
  # ---------------------------------------------------------------------------
  # The version, decided once for every job.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    # A few seconds.
    timeout-minutes: 10
    outputs:
      value: ${{ steps.resolve.outputs.value }}
      pack: ${{ steps.resolve.outputs.pack }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      channel: ${{ steps.resolve.outputs.channel }}
      mirror: ${{ steps.resolve.outputs.mirror }}
    steps:
      # Full history: a tagged commit is checked against main and develop below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: version from the tag or the input
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT: ${{ inputs.version }}
          MIRROR: ${{ inputs.mirror }}
          RUN: ${{ github.run_number }}
        run: |
          mirror=false
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$MIRROR" ]; then
            if [ -n "$INPUT" ]; then
              echo "::error::give either version or mirror, not both"
              exit 1
            fi
            case "$MIRROR" in
              helper-v*) value="${MIRROR#helper-v}" ;;
              *) echo "::error::mirror '$MIRROR': expected a tag helper-v<version>"; exit 1 ;;
            esac
            # Mirroring builds nothing, but it moves a channel: from the release branches only.
            # A stable tag may be mirrored from develop: its release was only created from a
            # commit of main (the tag rule below), and the mirror republishes its files as is.
            if [ "$REF" != refs/heads/main ] && [ "$REF" != refs/heads/develop ]; then
              echo "::error::a mirror is dispatched from main or develop only (ref: $REF)"
              exit 1
            fi
            mirror=true
          else
            case "$REF" in
              refs/tags/helper-v*) value="${REF#refs/tags/helper-v}" ;;
              *) if [ "$EVENT" = workflow_dispatch ]; then value="${INPUT#v}"; else value=""; fi ;;
            esac
          fi
          # A malformed version would make a tag and packages no client can compare: refused here.
          # Each suffix part starts and ends with an alphanumeric character.
          part='[0-9A-Za-z]([0-9A-Za-z-]*[0-9A-Za-z])?'
          if [ -n "$value" ] && ! printf '%s' "$value" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+(-$part(\.$part)*)?\$"; then
            echo "::error::version '$value': expected X.Y.Z or X.Y.Z-suffix"
            exit 1
          fi
          case "$value" in *-*) prerelease=true; channel=beta ;; *) prerelease=false; channel=stable ;; esac
          # A dispatched version is published from the release branches only: a stable version
          # from an unmerged branch would become the stable feed of every installed helper.
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$value" ] && [ "$mirror" = false ]; then
            if [ "$prerelease" = false ] && [ "$REF" != refs/heads/main ]; then
              echo "::error::a stable version is dispatched from main only (ref: $REF)"
              exit 1
            fi
            if [ "$prerelease" = true ] && [ "$REF" != refs/heads/main ] && [ "$REF" != refs/heads/develop ]; then
              echo "::error::a pre-release is dispatched from main or develop only (ref: $REF)"
              exit 1
            fi
          fi
          # The same rule for a pushed tag, which may sit on any commit: a stable tag must be on
          # main, a pre-release tag on main or develop.
          if [ "$EVENT" = push ] && [ -n "$value" ]; then
            on() { git merge-base --is-ancestor "$GITHUB_SHA" "origin/$1" 2>/dev/null; }
            if [ "$prerelease" = false ] && ! on main; then
              echo "::error::stable tag $REF is not on main: delete the tag and tag a commit of main"
              exit 1
            fi
            if [ "$prerelease" = true ] && ! on main && ! on develop; then
              echo "::error::pre-release tag $REF is on neither main nor develop"
              exit 1
            fi
          fi
          # A trial build still needs a version for the packages; it is never published.
          pack="${value:-0.0.1-trial.$RUN}"
          {
            echo "value=$value"
            echo "pack=$pack"
            echo "prerelease=$prerelease"
            echo "channel=$channel"
            echo "mirror=$mirror"
          } >> "$GITHUB_OUTPUT"
          echo "version='$value' pack='$pack' prerelease=$prerelease channel=$channel mirror=$mirror"

  # ---------------------------------------------------------------------------
  # Windows x64: the only published platform for now.
  # ---------------------------------------------------------------------------
  windows:
    needs: version
    if: needs.version.outputs.mirror != 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      wired: ${{ steps.wired.outputs.wired }}
    env:
      VERSION: ${{ needs.version.outputs.pack }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install vpk
        shell: bash
        run: dotnet tool install -g vpk --version "$VPK_VERSION"

      # The dry run needs no dependency; `previous` installs @vercel/blob itself.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        run: cargo test -p helper

      - name: Build
        run: cargo build -p helper --release

      # The installer launches the helper with `--veloapp-*` arguments, and only a main() that
      # calls `helper::updater::startup()` before parsing its arguments answers them (exit 0 at
      # once) and applies updates; an unwired helper refuses the argument (nonzero exit: 1, or
      # killed by the timeout while a release build shows its error box). vpk does not check
      # it, so the built binary is run as the installer would. `Updater::start` cannot be
      # observed without an installation: it is looked for in main.rs. The release job refuses
      # to publish when either is missing.
      - name: Is the updater wired into main.rs?
        id: wired
        shell: bash
        run: |
          hook=false
          if timeout 30 target/release/faulk-helper.exe --veloapp-install 0.0.1 >/dev/null 2>&1; then hook=true; fi
          started=false
          if grep -Eq '^[^/]*Updater::start\(' crates/helper/src/main.rs; then started=true; fi
          echo "startup hook answered: $hook, Updater::start called: $started"
          if [ "$hook" = true ] && [ "$started" = true ]; then
            echo "wired=true" >> "$GITHUB_OUTPUT"
          else
            echo "wired=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the helper does not answer --veloapp-install (helper::updater::startup() first in main) or main.rs does not call Updater::start: this build cannot install cleanly nor update itself, and cannot be published."
          fi

      # Deltas: vpk builds the delta of this version against the newest full package in the
      # output folder, so it needs the latest STABLE package, read from the Blob store (its
      # SHA-256 checked against the stable feed). Pre-releases get no delta: the beta channel
      # installs full packages (see `filter_feed` in updater.rs). Releases only: a trial build
      # (version 0.0.1-trial.N) would otherwise be packed next to a newer stable package.
      - name: Previous stable package, for the delta
        if: needs.version.outputs.value != '' && needs.version.outputs.prerelease != 'true'
        shell: bash
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.HELPER_RELEASES_READ_WRITE_TOKEN }}
        run: |
          mkdir -p releases
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::warning::no HELPER_RELEASES_READ_WRITE_TOKEN: no previous package, no delta (the release job will refuse to publish anyway)"
            exit 0
          fi
          (cd scripts/helper-release && npm ci)
          node scripts/helper-release/publish.mjs previous --os win --version "$VERSION" --out releases
          ls -la releases

      - name: Package
        shell: bash
        run: |
          mkdir -p pack
          cp target/release/faulk-helper.exe pack/
          # SIGNING (Windows) - Azure Artifact Signing, once the account exists: log in with
          # azure/login, write the metadata.json (Endpoint, CodeSigningAccountName,
          # CertificateProfileName) and add:  --azureTrustedSignFile metadata.json
          vpk pack \
            --packId "$PACK_ID" \
            --packVersion "$VERSION" \
            --packDir pack \
            --mainExe faulk-helper.exe \
            --packTitle "Faulk Helper" \
            --packAuthors "Sparkle" \
            --runtime win-x64 \
            --outputDir releases
          ls -la releases

      # Only this version's files: the previous full package downloaded for the delta is
      # already in the store (the feed cites it; the publication checks it is there).
      - name: Files of this version
        shell: bash
        run: |
          mkdir -p out
          for f in "$PACK_ID-$VERSION-full.nupkg" "$PACK_ID-$VERSION-delta.nupkg" \
                   "$PACK_ID-win-Setup.exe" "$PACK_ID-win-Portable.zip" \
                   releases.win.json assets.win.json RELEASES; do
            if [ -f "releases/$f" ]; then cp "releases/$f" out/; fi
          done
          ls -la out

      # The publication on the real vpk output, against an in-memory store: no token, nothing
      # sent. A release runs the real one in the release job.
      - name: Dry run of the Blob publication
        if: needs.version.outputs.value == ''
        run: node scripts/helper-release/publish.mjs publish --dir out --os win --version ${{ needs.version.outputs.pack }} --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: helper-win-${{ needs.version.outputs.pack }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # macOS and Linux: built and packaged for the record, NOT published, NOT signed, NOT tested.
  # macOS updates need a signed and notarized app; see the distribution doc.
  # The macOS leg runs for a production release only (a version); a trial build runs Linux alone.
  # ---------------------------------------------------------------------------
  unix:
    needs: version
    if: needs.version.outputs.mirror != 'true'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes are expensive: its leg runs for a production release only (a version:
        # tag push or dispatch with a version), never for a trial build. Keep the two literals
        # in step with scripts/ci/release-helper-workflow.test.mjs.
        include: ${{ fromJSON(needs.version.outputs.value != '' && '[{"os":"macos-latest","channel":"osx","runtime":"osx-arm64"},{"os":"ubuntu-latest","channel":"linux","runtime":"linux-x64"}]' || '[{"os":"ubuntu-latest","channel":"linux","runtime":"linux-x64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.pack }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool install -g vpk --version "$VPK_VERSION"
      - run: cargo build -p helper --release
      - name: Package
        run: |
          mkdir -p pack
          cp target/release/faulk-helper pack/
          vpk pack --packId "$PACK_ID" --packVersion "$VERSION" --packDir pack \
            --mainExe faulk-helper --packTitle "Faulk Helper" --packAuthors "Sparkle" \
            --runtime "${{ matrix.runtime }}" --outputDir releases
          ls -la releases
      - uses: actions/upload-artifact@v4
        with:
          name: helper-${{ matrix.channel }}-${{ needs.version.outputs.pack }}-unpublished
          path: releases/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The release: here (private, the archive and the changelog), then the Blob store that
  # get.faulk.app redirects to.
  # ---------------------------------------------------------------------------
  release:
    needs: [version, windows]
    if: needs.version.outputs.value != '' && needs.version.outputs.mirror != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One publication per channel at a time: the channel guard reads the feed, then writes.
    # GitHub keeps one pending job per group: a third run cancels the one waiting, which then
    # shows as cancelled. Re-run that job alone: the publication is idempotent.
    concurrency:
      group: helper-blob-${{ needs.version.outputs.channel }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.value }}
      TAG: helper-v${{ needs.version.outputs.value }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      DRAFT: ${{ inputs.draft }}
    steps:
      - name: Refuse an unwired helper
        if: needs.windows.outputs.wired != 'true'
        run: |
          echo "::error::the helper does not start the updater (helper::updater::startup() first in main, and Updater::start): publishing it would ship a helper that never updates. See docs/architecture/04-distribution-helper.md."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: helper-win-${{ needs.version.outputs.value }}
          path: dist

      - name: Draft, nothing published to Blob
        if: inputs.draft
        run: echo "::notice title=Draft::$TAG is a draft release; nothing was published to the Blob store, no installed helper sees it."

      - uses: actions/setup-node@v4
        if: ${{ !inputs.draft }}
        with:
          node-version: 24

      # Before the GitHub release: a refused publication (a full re-run rebuilt other bytes) must
      # not replace the archive's files either. Packages first, the feed last; an older version
      # than the channel's feed uploads its packages only. Re-running only this job reuses the built files and completes a partial
      # publication; a full re-run rebuilds different bytes and is refused (bump the version).
      - name: Publish to the Blob store
        if: ${{ !inputs.draft }}
        shell: bash
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.HELPER_RELEASES_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::the secret HELPER_RELEASES_READ_WRITE_TOKEN does not exist: nothing published, no installed helper sees $VERSION"
            exit 1
          fi
          (cd scripts/helper-release && npm ci)
          node scripts/helper-release/publish.mjs publish --dir dist --os win --version "$VERSION"

      # GitHub makes every new non-prerelease "latest" by default; re-running an older tag
      # would then mark it latest. Only a version newer than the current latest takes it.
      - name: Create the release here
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags() {
            [ "$PRERELEASE" = true ] && echo "--prerelease"
            [ "$DRAFT" = true ] && echo "--draft"
            if [ "$PRERELEASE" = true ]; then echo "--latest=false"; return; fi
            current=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
            current="${current#helper-v}"
            if [ -z "$current" ] || [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n1)" = "$VERSION" ]; then
              echo "--latest"
            else
              echo "::warning::$VERSION is not newer than the latest release $current: it does not become latest" >&2
              echo "--latest=false"
            fi
          }
          # Idempotent: a re-run finds the release, replaces its files and syncs its state.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG already exists: its files are replaced and its state synced"
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            latest=$(flags | grep -- '--latest')
            if [ "$DRAFT" = true ]; then as_draft=true; else as_draft=false; fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft="$as_draft" --prerelease="$PRERELEASE" "$latest"
            exit 0
          fi
          mapfile -t f < <(flags)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Faulk Helper $VERSION" \
            --generate-notes \
            "${f[@]}"

  # ---------------------------------------------------------------------------
  # A release made before Blob (helper-v0.1.0), published to Blob from its files here.
  # ---------------------------------------------------------------------------
  mirror:
    needs: version
    if: needs.version.outputs.mirror == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: helper-blob-${{ needs.version.outputs.channel }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.value }}
      TAG: helper-v${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Files of the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          ls -la dist

      - name: Publish to the Blob store
        shell: bash
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.HELPER_RELEASES_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::the secret HELPER_RELEASES_READ_WRITE_TOKEN does not exist"
            exit 1
          fi
          (cd scripts/helper-release && npm ci)
          node scripts/helper-release/publish.mjs publish --dir dist --os win --version "$VERSION"
