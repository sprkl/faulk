name: Web setup
description: Rust (the web app builds the engine to WebAssembly and generates its types from Rust), pnpm, Node and the dependencies of web/.

inputs:
  rust-cache-key:
    description: Extra key of the Rust build cache, to share one cache between the jobs of a matrix.
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown, wasm32-wasip1-threads

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.rust-cache-key }}

    - uses: pnpm/action-setup@v4
      with:
        package_json_file: web/package.json

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml

    - name: Install the dependencies
      shell: bash
      working-directory: web
      run: pnpm install --frozen-lockfile
