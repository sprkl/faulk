schema_version: "1.1"
name: automate-filter-lanes
expected_outcome: |
  In French, without asking questions first: a production sheet for a 64-bar acid techno track at 134 bpm in D minor in which
  the movement of the sound is written as `automation` blocks (not only described in prose): a filter cutoff opening over the
  first drop, a resonance lane and a volume or pan lane, each aimed at a pattern that exists, with points in bar.beat, values in
  0-127, at least one non-linear curve and one step, all inside the arrangement. `sheet_tool.py check` passes with the lanes
  listed, and the rendered MIDI file carries them as control changes.
---
tags: [music-producer]
max_turns: 40
timeout_seconds: 900
allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
---

Je veux une ébauche de techno acid à 134 bpm en Ré mineur, 64 mesures : une intro, un premier drop, un break, un second drop. Le morceau vit surtout par le filtre de la ligne acid : le cutoff doit s'ouvrir lentement pendant le premier drop, retomber d'un coup au break, et la résonance doit monter avant le second drop. Je veux aussi qu'un deuxième paramètre bouge pour qu'on entende l'évolution même sans toucher le filtre. Écris la fiche de production complète avec les patterns, l'arrangement avec les numéros de mesures et le mouvement du son, vérifie-la et sors le fichier MIDI. Mets le résultat dans le dossier outputs.
