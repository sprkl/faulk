# The shipped web engine (`engine-wasm`, MO-2) is built for `wasm32-wasip1-threads`: one
# module, two instances on one shared memory (the prepare Worker and the AudioWorklet).
# The render instance gets its own stack and thread-local block from these exports; the
# memory may grow to the wasm32 cap of 4 GiB (CT-3).
[target.wasm32-wasip1-threads]
rustflags = [
  "-C", "link-arg=--export=__stack_pointer",
  "-C", "link-arg=--export=__wasm_init_tls",
  "-C", "link-arg=--export=__tls_size",
  "-C", "link-arg=--export=__tls_align",
  "-C", "link-arg=--export=__tls_base",
  "-C", "link-arg=--max-memory=4294967296",
]
