[package]
name = "commands"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Every Faulk user action as a typed command, the single source for the UI, MCP tools and TypeScript types."

[dependencies]
engine = { path = "../engine" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: f64 values (gains, parameters, automation) read back exactly.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
project = { path = "../project" }
