[package]
name = "project"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Faulk project document: tracks, clips, devices, automation, transport settings. Pure Rust, no I/O."

[dependencies]
engine = { path = "../engine", features = ["serde"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
