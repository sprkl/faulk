[package]
name = "helper"
version = "0.1.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Faulk native helper (Boost mode): the local bridge running the engine with native audio and MIDI."

[[bin]]
name = "faulk-helper"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
commands = { path = "../commands" }
protocol = { path = "../protocol" }
project = { path = "../project" }
cpal = "0.18.2"
midir = "0.11.1"
serde_json = "1.0.154"
getrandom = "0.4.3"
dirs = "7.0.0"
futures-util = "0.3.34"
assert_no_alloc = "1.1.2"
tokio-tungstenite = "0.30.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
webbrowser = "1.2.4"
velopack = { version = "=1.3.39-g8d2844f", features = ["public-utils"] }
semver = "1.0.28"
ureq = { version = "3.4.2", default-features = false }
url = "2.5.8"
log = "0.4.34"

[dev-dependencies]
regex = "1.13.1"
# The big project of the paced-send tests (#245).
test-support = { path = "../test-support" }

[target."cfg(windows)".dependencies]
tray-icon = { version = "0.26.1", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }
winreg = "0.56.0"

[target."cfg(windows)".build-dependencies]
embed-resource = "3.0.11"
