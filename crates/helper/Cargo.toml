[package]
name = "helper"
version = "0.1.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Faulk native helper (Boost mode): the local bridge running the engine with native audio and MIDI."

[[bin]]
name = "faulk-helper"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
commands = { path = "../commands" }
protocol = { path = "../protocol" }
project = { path = "../project" }
# The native audio import in Boost (#778): the page's decoder, compiled natively.
audio-import = { path = "../audio-import" }
cpal = "0.18.2"
midir = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
getrandom = "0.4.3"
# The export job's engine streams arrive in base64 in a JSON message (#319).
base64 = "0.23.1"
dirs = "7.0.0"
futures-util = "0.3.34"
assert_no_alloc = "1.1.2"
tokio-tungstenite = "0.30.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
webbrowser = "1.2.4"
velopack = { version = "=1.3.39-g8d2844f", features = ["public-utils"] }
semver = "1.0.28"
ureq = { version = "3.4.2", default-features = false }
url = "2.5.8"
log = "0.4.34"
# The MCP server (AG-1): rmcp for the protocol, hyper to serve its HTTP transport on the
# helper's own port (`mcp.rs`).
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
http = "1.5.0"
tower-service = "0.3.3"

[dev-dependencies]
regex = "1.13.1"
# The big project of the paced-send tests (#245).
test-support = { path = "../test-support" }

[target."cfg(windows)".dependencies]
tray-icon = { version = "0.26.1", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Console", "Win32_Storage_FileSystem"] }
winreg = "0.56.0"
# The folder dialog of the project folder (AU-7): the common dialog, no feature of its own.
rfd = { version = "0.17.2", default-features = false }

[target."cfg(windows)".build-dependencies]
embed-resource = "3.0.11"
