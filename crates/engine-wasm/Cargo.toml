[package]
name = "engine-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Faulk engine as a WebAssembly module with a plain C ABI, loaded inside an AudioWorklet."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { path = "../engine" }

[dev-dependencies]
wasmi = "2.0.0"
