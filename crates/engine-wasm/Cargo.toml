[package]
name = "engine-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Faulk engine as a WebAssembly module with a plain C ABI, loaded inside an AudioWorklet."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Exports the device contract's test scenario (`fk_contract_scenario`), for the
# native/WASM parity test only (`tests/device_parity.rs` builds the module with it).
device-contract = ["engine/testing"]
# Exports the prepare/apply cycle's test host (`fk_cycle_*`, MO-1), for the native/WASM
# parity and memory growth tests only (`tests/cycle_parity.rs` builds the module with it).
engine-cycle = ["engine/testing"]
# Exports the transport clock's test scenario (`fk_transport_scenario`, TR-1), for the
# native/WASM parity test only (`tests/transport_parity.rs` builds the module with it).
transport-scenario = ["engine/testing"]
# Exports the timed events' test scenario (`fk_events_scenario`, MO-4), for the
# native/WASM parity test only (`tests/events_parity.rs` builds the module with it).
events-scenario = ["engine/testing"]
# Exports the disk streaming scenario (`fk_stream_scenario`, AU-3), for the native/WASM
# parity test only (`tests/stream_parity.rs` builds the module with it).
stream-scenario = ["engine/testing"]
# Exports the non-finite scenario (`fk_nonfinite_scenario`, #667: NaN samples turned to
# silence and counted in the report), for the native/WASM parity test only
# (`tests/nonfinite_parity.rs` builds the module with it).
nonfinite-scenario = ["engine/testing"]
# Exports the event stream of Trim's scenario (`fk_trim_scenario`, #693), for the
# native/WASM parity test only (`tests/trim_parity.rs` builds the module with it).
trim-scenario = ["engine/testing"]
# Exports the spectrum scenario (`fk_spectrum_scenario`, #156: a Contour's spectrum computed off
# the audio path and carried by the report), for the native/WASM parity test only
# (`tests/spectrum_parity.rs` builds the module with it).
spectrum-scenario = ["engine/testing"]

[dependencies]
engine = { path = "../engine" }

[dev-dependencies]
engine = { path = "../engine", features = ["testing"] }
wasmi = "2.0.0"
commands = { path = "../commands" }
test-support = { path = "../test-support" }
project = { path = "../project" }
