[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Faulk audio engine core: pure DSP, no I/O, no allocation on the audio path."

[features]
# Serialization of the time types (`engine::time`) for the project document.
# Off by default: the worklet build (`engine-wasm`) carries no dependency.
serde = ["dep:serde"]
# JSON Schema of the device descriptors (`engine::device`), for the schema bundle.
schema = ["serde", "dep:schemars"]
# The test devices of the device contract (`engine::device::testing`): an instrument, an
# effect and a MIDI effect that the contract tests and the native/WASM parity test render.
testing = []

[dependencies]
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"], optional = true }
schemars = { version = "1.2.3", optional = true }

[dev-dependencies]
rtrb = "0.4.0"
# The crate itself with `serde` on, so that `cargo test -p engine` runs the serde tests.
engine = { path = ".", features = ["serde", "testing"] }
assert_no_alloc = "1"
test-support = { path = "../test-support" }
commands = { path = "../commands" }
proptest = "1"
serde_json = "1.0.154"
