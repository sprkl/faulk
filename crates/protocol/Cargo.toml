[package]
name = "protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Messages between the Faulk web UI and an engine (native helper), versioned, with their JSON Schema."

[dependencies]
commands = { path = "../commands" }
# The device descriptors (CT-5) and their JSON Schema, exported in the bundle.
engine = { path = "../engine", features = ["schema"] }
# The scales of the project (#695): their degrees, exported in the bundle.
project = { path = "../project" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
